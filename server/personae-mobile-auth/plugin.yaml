name: personae-mobile-auth
version: 1.2.0
kind: backend
author: cody (Personae Mobile)
description: >-
  Dashboard auth provider for the Personae Mobile Android app: a non-interactive
  shared-bearer credential (HERMES_PERSONAE_BEARER, env-only, >=256-bit, fail-closed
  entropy gate) registered through the sanctioned
  PluginContext.register_dashboard_auth_provider seam. Implements both non-interactive
  capabilities the dashboard documents: verify_token (token-auth seam, constant-time
  compare) and verify_session (the native-app bearer seam the DashboardAuthProvider base
  documents for token-mode remote clients, which the gate honours on every route and which
  sets request.state.session so POST /api/auth/ws-ticket can mint a WS ticket). Never
  mints an interactive cookie session; the login page entry is inert by design. No-op when
  HERMES_PERSONAE_BEARER is unset. 1.1.0 (Personae Mobile 0.6.0) adds browser-mediated
  device pairing: a signed-in browser opens /pair (or the phone's in-app browser opens
  /login?next=/pair), gets a single-use 300 s code as a QR + personae:// deep link, and the
  phone redeems it at POST /api/plugins/personae-mobile-auth/pair/redeem for a per-device
  token stored only as sha256 in state/credentials.json (0600), revocable from
  /api/plugins/personae-mobile-auth/devices. The env bearer keeps working unchanged.
  1.2.0 (Personae Mobile 0.7.0) adds GET /tailscale/peers: the host runs
  `tailscale status --json` and returns {available, self, peers:[{name, ip, os, online}]}
  over IPv4 for the app's "choose device" picker (a phone cannot enumerate a tailnet).
  Readable by the owner AND by a paired device; any CLI problem answers
  {available:false, reason} instead of failing, and the app falls back to manual entry.
requires_env:
  - HERMES_PERSONAE_BEARER
